name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Must never change: macOS ties the Accessibility grant and the Automation
  # grant for Dia to the signing identity plus this identifier. A different
  # value makes every upgrade look like a new program, both grants are lost,
  # and capture silently degrades to no window titles and no browser tab.
  BUNDLE_ID: dev.pkarpovich.nikki
  # Apple Silicon only. The crate links Apple frameworks, the runner is arm64,
  # so this is the native target and nothing is cross-compiled.
  TARGET: aarch64-apple-darwin

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - uses: Swatinem/rust-cache@v2

      # A tag that disagrees with Cargo.toml would ship a binary whose version
      # nobody can trace back, and the formula would carry the wrong number.
      - name: Tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(mise exec -- cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$tag" != "$crate" ]; then
            echo "tag $tag does not match Cargo.toml $crate" >&2
            exit 1
          fi

      - run: mise run check

      - run: mise exec -- cargo build --release --target "$TARGET"

      # build.rs embeds Info.plist into __TEXT,__info_plist. Without a
      # non-empty NSAppleEventsUsageDescription there macOS never shows the
      # Automation prompt for Dia, the extractor is denied for the life of the
      # binary, and the only symptom is a -1743 in the log - so the release
      # refuses to ship a binary that lost it.
      - name: Info.plist is embedded
        run: |
          binary="target/$TARGET/release/nikki"
          plist=$(mktemp)
          otool -P "$binary" | tail -n +3 > "$plist"
          plutil -lint "$plist"
          identifier=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          if [ "$identifier" != "$BUNDLE_ID" ]; then
            echo "CFBundleIdentifier is $identifier, not $BUNDLE_ID" >&2
            exit 1
          fi
          usage=$(/usr/libexec/PlistBuddy -c 'Print :NSAppleEventsUsageDescription' "$plist")
          if [ -z "$usage" ]; then
            echo "NSAppleEventsUsageDescription is empty" >&2
            exit 1
          fi

      - uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      # The app bundle is the whole point of shipping a cask: TCC identifies a
      # bundle by its identifier at a path that never moves, and a loose binary
      # by its path alone - which Homebrew changes on every version, losing the
      # Accessibility grant on each upgrade.
      - name: Bundle and sign
        env:
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          identity=$(security find-identity -v -p codesigning |
            grep "Developer ID Application" | grep "($TEAM_ID)" |
            head -n 1 | awk '{print $2}')
          if [ -z "$identity" ]; then
            echo "no Developer ID Application identity for team $TEAM_ID" >&2
            exit 1
          fi
          mkdir -p dist
          ./scripts/bundle.sh "target/$TARGET/release/nikki" dist "$identity"

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent dist/Nikki.app "dist/Nikki-arm64-$version.zip"
          rm -rf dist/Nikki.app
          cd dist && shasum -a 256 *.zip > checksums.txt && cat checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true

  cask:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Read the version and the checksum
        id: facts
        run: |
          {
            version="${GITHUB_REF_NAME#v}"
            echo "version=$version"
            echo "sha=$(shasum -a 256 "dist/Nikki-arm64-$version.zip" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: pkarpovich/homebrew-apps
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write the cask
        env:
          VERSION: ${{ steps.facts.outputs.version }}
          SHA: ${{ steps.facts.outputs.sha }}
        run: |
          rm -f tap/Formula/nikki.rb
          mkdir -p tap/Casks
          cat > tap/Casks/nikki.rb <<EOF
          cask "nikki" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/pkarpovich/nikki/releases/download/v#{version}/Nikki-arm64-#{version}.zip"
            name "nikki"
            desc "macOS activity capture daemon"
            homepage "https://github.com/pkarpovich/nikki"

            depends_on arch: :arm64

            # The app is what makes the macOS permissions durable. TCC identifies a
            # bundle by its identifier at a path that never moves, and a loose binary
            # by its path alone - so the Homebrew formula this cask replaced lost the
            # Accessibility grant on every upgrade, the Cellar path carrying the
            # version. The binary stanza keeps \`nikki\` on PATH, pointing inside the
            # app rather than at a copy, so an upgrade replaces both at once.
            app "Nikki.app"
            binary "#{appdir}/Nikki.app/Contents/MacOS/nikki"

            caveats <<~CAVEATS
              Write ~/.config/nikki/config.toml BEFORE installing the service.
              service_url and device are required and the daemon exits without
              them, which under keep_alive is a restart loop. The full set of
              keys is in the README; the minimum is:

                service_url = "https://nikki.example"
                device = "mbp-21"

                [browser]
                profile = "MBP_21"

              Then:

                nikki --check-config
                nikki install

              \`nikki install\` writes the launchd agent dev.pkarpovich.nikki and
              starts it. It also unloads and removes the agent \`brew services\`
              used to write, so the two never run at once. An upgrade replaces
              the app in place and needs nothing further.

              Grant Accessibility to Nikki in System Settings > Privacy &
              Security, then \`nikki install\` once more - macOS caches the denial
              for the life of the process. Without it capture continues, but every
              window title and document path is null and the records carry
              degraded: true. The grant survives upgrades: the app is identified
              by its bundle id at a path that does not move.

              The first time it reads a browser tab macOS asks for Automation
              access to Dia. Declining is permanent for this binary and the only
              symptom is a -1743 in the log.

              Logs are at ~/Library/Logs/nikki.log and nikki.err.log.
            CAVEATS

            uninstall quit:      "dev.pkarpovich.nikki",
                      launchctl: "dev.pkarpovich.nikki"

            zap trash: [
              "~/.config/nikki",
              "~/Library/Application Support/nikki",
              "~/Library/Logs/nikki.log",
              "~/Library/Logs/nikki.err.log",
            ]
          end
          EOF

      - name: Commit and push
        working-directory: tap
        env:
          VERSION: ${{ steps.facts.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/nikki.rb
          git diff --cached --quiet && exit 0
          git commit -m "nikki ${VERSION}"
          git push
